<mat-card [class]="'recipe-card ' + (layout === 'scroll' ? 'scroll-layout' : '')">
  <a
    class="recipe-link"
    [routerLink]="['/recipes', recipe.id]"
    [attr.aria-label]="'View recipe: ' + recipe.name">
  </a>

  <div class="recipe-image">
    <picture *ngIf="recipe.image as image">
      <source media="(max-width: 348px)" [srcset]="image.thumbnail">
      <img [src]="image.medium" [alt]="recipe.name" [loading]="imageLoading" decoding="async">
    </picture>
    <div *ngIf="!recipe.image?.thumbnail" class="recipe-image-placeholder">
      <mat-icon>restaurant</mat-icon>
    </div>
  </div>

  <mat-card-header>
    <mat-card-title>{{ recipe.name }}</mat-card-title>
    <mat-card-subtitle>by {{ recipe.createdBy.name }}</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <div class="recipe-info">
      <div class="info-row">
        <mat-icon>schedule</mat-icon>
        <span>{{ recipe.prepTime + recipe.cookTime }} min total</span>
      </div>

      <div class="info-row">
        <mat-icon>people</mat-icon>
        <span>{{ recipe.servings }} servings</span>
      </div>

      <div class="tags" *ngIf="recipe.tags.length > 0">
        <mat-chip *ngFor="let tag of recipe.tags | slice:0:3">{{ tag }}</mat-chip>
        <span *ngIf="recipe.tags.length > 3" class="more-tags">+{{ recipe.tags.length - 3 }} more</span>
      </div>
    </div>
  </mat-card-content>

  <mat-card-actions *ngIf="canEdit || isLoggedIn" align="end">
    <button *ngIf="isLoggedIn && !canEdit"
            mat-stroked-button
            [color]="isSaved ? 'accent' : 'primary'"
            (click)="onSaveClick($event)"
            [disabled]="saving"
            [attr.aria-pressed]="isSaved"
            [matTooltip]="isSaved ? 'Remove from saved recipes' : 'Save recipe'"
            class="save-button">
      <mat-icon>{{ isSaved ? 'bookmark' : 'bookmark_border' }}</mat-icon>
      {{ saving ? 'Saving…' : isSaved ? 'Saved' : 'Save' }}
    </button>
    <ng-container *ngIf="canEdit">
      <button mat-stroked-button color="primary" (click)="onEditClick($event)">
        <mat-icon>edit</mat-icon>
        Edit
      </button>
      <button mat-stroked-button color="warn" (click)="onDeleteClick($event)">
        <mat-icon>delete</mat-icon>
        Delete
      </button>
    </ng-container>
  </mat-card-actions>
</mat-card>
