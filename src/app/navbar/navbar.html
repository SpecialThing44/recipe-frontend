<mat-toolbar role="navigation" aria-label="Main navigation">
  <a
    mat-button
    routerLink="/dashboard"
    class="brand-link"
    (mouseenter)="prefetch('/dashboard')"
    (focus)="prefetch('/dashboard')"
  >
    <mat-icon>restaurant_menu</mat-icon>
    <span class="brand">Spencer’s recipes</span>
  </a>
  <span class="spacer"></span>

  <!-- Desktop Menu -->
  <div class="desktop-menu">
    @if (user; as user) {
      <a
        mat-button
        routerLink="/recipes"
        routerLinkActive="active-link"
        ariaCurrentWhenActive="page"
        (mouseenter)="prefetch('/recipes')"
        (focus)="prefetch('/recipes')"
        >Recipes</a
      >
      <a
        mat-button
        routerLink="/ingredients"
        routerLinkActive="active-link"
        ariaCurrentWhenActive="page"
        (mouseenter)="prefetch('/ingredients')"
        (focus)="prefetch('/ingredients')"
        >Ingredients</a
      >
      <a
        mat-button
        routerLink="/users"
        routerLinkActive="active-link"
        ariaCurrentWhenActive="page"
        (mouseenter)="prefetch('/users')"
        (focus)="prefetch('/users')"
        >Users</a
      >
      @if (user.admin) {
        <a
          mat-button
          routerLink="/admin/ingredient-weights"
          routerLinkActive="active-link"
          ariaCurrentWhenActive="page"
          (mouseenter)="prefetch('/admin/ingredient-weights')"
          (focus)="prefetch('/admin/ingredient-weights')"
          >Admin</a
        >
      }
      <button
        mat-icon-button
        [matMenuTriggerFor]="accountMenu"
        aria-label="Account menu"
        class="account-button"
      >
        <div class="account-bubble">
          @if (user.avatar?.thumbnail) {
            <img
              [src]="$safeNavigationMigration(user.avatar?.thumbnail)"
              [alt]="user.name + ' avatar'"
            />
          }
          @if (!user.avatar?.thumbnail) {
            <mat-icon aria-hidden="false" aria-label="Account">person</mat-icon>
          }
        </div>
      </button>
      <mat-menu #accountMenu="matMenu">
        <button mat-menu-item [routerLink]="['/users', user.id]">
          <mat-icon>account_circle</mat-icon>
          <span>Account</span>
        </button>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
    } @else {
      <a
        mat-button
        routerLink="/recipes"
        routerLinkActive="active-link"
        ariaCurrentWhenActive="page"
        (mouseenter)="prefetch('/recipes')"
        (focus)="prefetch('/recipes')"
        >Recipes</a
      >
      <a
        mat-button
        routerLink="/ingredients"
        routerLinkActive="active-link"
        ariaCurrentWhenActive="page"
        (mouseenter)="prefetch('/ingredients')"
        (focus)="prefetch('/ingredients')"
        >Ingredients</a
      >
      <a
        mat-button
        routerLink="/users"
        routerLinkActive="active-link"
        ariaCurrentWhenActive="page"
        (mouseenter)="prefetch('/users')"
        (focus)="prefetch('/users')"
        >Users</a
      >
      <button mat-button class="login-button" (click)="login()">Log in / Sign up</button>
    }
  </div>

  <!-- Mobile Menu -->
  <button
    mat-icon-button
    [matMenuTriggerFor]="mobileMenu"
    class="mobile-menu-trigger"
    aria-label="Open navigation menu"
  >
    <mat-icon>menu</mat-icon>
  </button>

  <mat-menu #mobileMenu="matMenu">
    <a
      mat-menu-item
      routerLink="/recipes"
      routerLinkActive="mobile-active-link"
      ariaCurrentWhenActive="page"
      (mouseenter)="prefetch('/recipes')"
      (focus)="prefetch('/recipes')"
      >Recipes</a
    >
    <a
      mat-menu-item
      routerLink="/ingredients"
      routerLinkActive="mobile-active-link"
      ariaCurrentWhenActive="page"
      (mouseenter)="prefetch('/ingredients')"
      (focus)="prefetch('/ingredients')"
      >Ingredients</a
    >
    <a
      mat-menu-item
      routerLink="/users"
      routerLinkActive="mobile-active-link"
      ariaCurrentWhenActive="page"
      (mouseenter)="prefetch('/users')"
      (focus)="prefetch('/users')"
      >Users</a
    >
    @if (user?.admin) {
      <a
        mat-menu-item
        routerLink="/admin/ingredient-weights"
        routerLinkActive="mobile-active-link"
        ariaCurrentWhenActive="page"
        (mouseenter)="prefetch('/admin/ingredient-weights')"
        (focus)="prefetch('/admin/ingredient-weights')"
        >Admin</a
      >
    }

    <mat-divider></mat-divider>

    @if (user; as user) {
      <button mat-menu-item [routerLink]="['/users', user.id]">
        <div class="account-bubble-mini">
          @if (user.avatar?.thumbnail) {
            <img
              [src]="$safeNavigationMigration(user.avatar?.thumbnail)"
              [alt]="user.name + ' avatar'"
            />
          }
          @if (!user.avatar?.thumbnail) {
            <mat-icon aria-hidden="false" aria-label="Account">person</mat-icon>
          }
        </div>
        <span>Account ({{ user.name }})</span>
      </button>
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Logout</span>
      </button>
    } @else {
      <button mat-menu-item (click)="login()">
        <mat-icon>login</mat-icon>
        <span>Login/Signup</span>
      </button>
    }
  </mat-menu>
</mat-toolbar>
